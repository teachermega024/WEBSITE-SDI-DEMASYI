<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Panel Admin | SDI Dewi Masyithoh</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginView" class="login-layout"><form id="loginForm" class="login-card"><img src="assets/logo.png" alt="Logo SDI"><h1>Panel Admin</h1><p>SDI Dewi Masyithoh Gondanglegi</p><label>Username<input name="username" autocomplete="username" required value="admin"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Masuk Dashboard</button><p id="loginMessage" role="alert"></p></form></div>
<div id="dashboard" class="app" hidden><aside><div class="brand"><img src="assets/logo.png" alt="Logo"> <span>SDI Dewi Masyithoh<small>Content Management System</small></span></div><nav id="navigation"></nav><a class="public-link" href="index.html" target="_blank" rel="noopener">↗ Lihat Website</a><button id="logoutBtn" class="logout">Keluar</button></aside><main><header><div><small>PENGELOLAAN WEBSITE SEKOLAH</small><h1 id="pageTitle">Dashboard</h1></div><div class="account">● Administrator</div></header><div class="intro"><strong>Kelola informasi sekolah dengan mudah.</strong><p>Perubahan akan ditampilkan di website ketika konten dipublikasikan.</p></div><div class="toolbar"><input id="search" placeholder="Cari judul..." aria-label="Cari konten"><button id="addBtn">+ Tambah Konten</button></div><div id="items" class="items"></div><div id="message" role="status"></div></main></div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle">Tambah Konten</h2><button type="button" id="closeBtn" class="icon-btn">✕</button></div><input type="hidden" name="id"><label>Judul / Nama<input name="title" maxlength="180" required></label><div class="two"><label>Kategori / Jabatan<input name="category" maxlength="70" placeholder="Misalnya: Kegiatan / Guru Kelas"></label><label>Tanggal<input type="date" name="date" required></label></div><label>Ringkasan / Deskripsi<textarea name="description" rows="3" maxlength="2000"></textarea></label><label>Isi artikel lengkap (khusus berita)<textarea name="content" rows="5" maxlength="20000"></textarea></label><label>Gambar (maksimal 4 MB)<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif"></label><img id="preview" class="preview" hidden alt="Pratinjau gambar"><label class="check"><input type="checkbox" name="published"> Publikasikan di website</label><div class="actions"><button type="button" id="cancelBtn" class="secondary">Batal</button><button type="submit" id="saveBtn">Simpan Konten</button></div><p id="editorMessage" role="alert"></p></form></dialog>
<script src="admin.js" defer></script></body></html>
